name: bingoals_mobile
description: "Bingoals - Gamified Annual Goal Tracking with Bingo Grid"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  lucide_icons: ^0.257.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP & API
  dio: ^5.8.0

  # Local Storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # Animations
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  shimmer: ^3.0.0

  # Charts & Graphics (for progress rings)
  fl_chart: ^0.70.2

  # Export & Share
  screenshot: ^3.0.0
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # Utilities
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  logger: ^2.4.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Fonts loaded via google_fonts package (Playfair Display, DM Sans)
